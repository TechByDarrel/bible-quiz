<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bible Quiz</title>
<style>
:root{--bg:#fff;--ink:#1f2540;--navy:#232a5c;--gold:#c9962b;--ok:#1f9d57;--no:#d93036;--dim:#7a7f99}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;display:flex;flex-direction:column;overflow-x:hidden}
#stage{flex:1;display:flex;flex-direction:column;align-items:center;padding:3vh 5vw 2vh;text-align:center;position:relative;min-height:0}
h1{margin:0;font-size:clamp(34px,min(8vh,10vw),96px);letter-spacing:.06em;color:var(--navy);font-weight:700;font-variant:small-caps}
.rule{display:flex;align-items:center;gap:14px;justify-content:center;margin:1vh 0 2vh}
.rule i{display:block;height:3px;width:12vw;background:var(--gold);border-radius:2px}
.rule b{width:14px;height:14px;background:var(--gold);transform:rotate(45deg)}
#main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:0}
#count{color:var(--dim);font-size:clamp(14px,2.4vh,26px);margin-bottom:1.5vh;font-family:Arial,sans-serif;min-height:3vh}
#q{font-size:clamp(22px,min(5.6vh,5.4vw),78px);line-height:1.3;max-width:1400px;font-weight:700}
#opts{display:grid;grid-template-columns:1fr 1fr;gap:2vh 2.5vw;width:100%;max-width:1300px;margin-top:3.5vh}
#opts:empty{display:none}
.opt{display:flex;align-items:center;gap:14px;text-align:left;border:3px solid #d9dcec;border-radius:14px;padding:1.6vh 1.6vw;font-size:clamp(18px,min(4vh,4.4vw),54px);font-family:Arial,sans-serif;background:#fafbff}
.opt span{flex:none;width:1.7em;height:1.7em;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85em}
.opt .mark{margin-left:auto;font-style:normal;font-weight:700;font-size:1.3em}
.opt.good{background:#e3f6ea;border-color:var(--ok)}
.opt.good span{background:var(--ok)} .opt.good .mark{color:var(--ok)}
.opt.bad{background:#fde8e9;border-color:var(--no)}
.opt.bad span{background:var(--no)} .opt.bad .mark{color:var(--no)}
#result{font:700 clamp(20px,min(4.6vh,6vw),56px) Arial,sans-serif;margin-top:2.5vh;min-height:1.2em}
#result.good{color:var(--ok)} #result.bad{color:var(--no)}
@media (max-width:640px){#opts{grid-template-columns:1fr}}
#timerWrap{position:absolute;right:3vw;top:2.5vh;width:min(13vh,22vw);height:min(13vh,22vw);visibility:hidden}
#timerWrap.on{visibility:visible}
#timerWrap svg{width:100%;height:100%;transform:rotate(-90deg)}
#timerWrap circle{fill:none;stroke-width:10}
#ring{stroke:var(--navy);stroke-linecap:round;transition:stroke .3s}
#sec{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(6vh,10vw);font-family:Arial,sans-serif;font-weight:700;color:var(--navy)}
#timerWrap.low #ring{stroke:var(--no)} #timerWrap.low #sec{color:var(--no)}
#overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.93);z-index:5}
#overlay.show{display:flex}
#overlay svg{width:min(58vh,80vw);height:min(58vh,80vw);animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
#bar{background:#f1f2f8;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;font-family:Arial,sans-serif;position:relative;z-index:6}
#bar.hide{display:none}
#bar button{font:600 15px Arial,sans-serif;border:0;border-radius:8px;padding:11px 14px;background:var(--navy);color:#fff;cursor:pointer;touch-action:manipulation}
#bar .ok{background:var(--ok)} #bar .no{background:var(--no)} #bar .g{background:#6b7194}
#bar input{width:64px;font:16px Arial,sans-serif;padding:10px 6px;border:2px solid #c5c8dd;border-radius:8px;text-align:center}
#bar small{color:var(--dim);flex-basis:100%;text-align:center;font-size:12px}
#tog{position:fixed;right:8px;bottom:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(35,42,92,.12);color:var(--navy);font-size:18px;z-index:7;cursor:pointer}
#tog:hover{background:rgba(35,42,92,.3)}
@media (max-width:820px){
#stage{padding:2vh 4vw 12vh}
#timerWrap{position:relative;right:auto;top:auto;width:76px;height:76px;margin:0 auto 12px;display:none;visibility:visible}
#timerWrap.on{display:block}
#sec{font-size:28px}
#main{justify-content:flex-start}
#opts{margin-top:2vh;gap:10px}
.opt{padding:12px 14px}
#bar button{flex:1 1 30%;padding:12px 8px}
#bar input{flex:1 1 20%}
}
@media (prefers-reduced-motion:reduce){#overlay svg{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <h1>Bible Quiz</h1>
  <div class="rule"><i></i><b></b><i></i></div>
  <div id="timerWrap">
    <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" stroke="#e3e5f0"/><circle id="ring" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="0"/></svg>
    <div id="sec">10</div>
  </div>
  <div id="main">
    <div id="count"></div>
    <div id="q"></div>
    <div id="opts"></div>
    <div id="result"></div>
  </div>
</div>
<div id="overlay"></div>
<div id="bar">
  <button class="g" id="bBack">Back (B)</button>
  <button id="bNext">Next (N)</button>
  <button id="bStart">Start timer (S)</button>
  <button class="ok" id="bOk">&#10003; Correct (C)</button>
  <button class="no" id="bNo">&#10007; Wrong (X)</button>
  <input id="jn" type="number" inputmode="numeric" min="1" max="30" placeholder="Q#">
  <button class="g" id="bGo">Go</button>
  <button class="g" id="bFs">Fullscreen (F)</button>
  <small>Keys: N next, S start, C correct, X wrong, B back, type a number to jump, H hide bar</small>
</div>
<button id="tog" title="Show or hide controls (H)">&#9881;</button>

<script>
// o = options A,B,C,D (audience sees only these, never the answers)
const Q=[
{q:"Mention two books of the Bible named after women.",o:["Ruth and Esther","Mary and Martha","Sarah and Hannah","Deborah and Lydia"]},
{q:"What four books tell about Jesus' life on Earth?",o:["Acts, Romans, James, Jude","Genesis, Exodus, Psalms, John","Luke, Acts, Mark, Hebrews","Matthew, Mark, Luke, John"]},
{q:"What was the name of the man who climbed a tree to see Jesus?",o:["Nicodemus","Zacchaeus","Bartimaeus","Lazarus"]},
{q:"Who did God permit Satan to torment?",o:["Job","Moses","Daniel","Jeremiah"]},
{q:"Who led Israel into the Promised Land?",o:["Moses","Aaron","Caleb","Joshua"]},
{q:"Who ate the holy temple's bread when he was hungry?",o:["Saul","David","Samuel","Solomon"]},
{q:"Who cursed little children for calling him bald?",o:["Elijah","Elisha","Isaiah","Jonah"]},
{q:"Who was the last Judge of Israel?",o:["Samson","Eli","Samuel","Gideon"]},
{q:"Whose shadow healed sick people?",o:["Paul","Peter","John","Philip"]},
{q:"Which apostle doubted Jesus' resurrection until he saw Him?",o:["Thomas","Peter","Andrew","Philip"]},
{q:"Who baptized the Ethiopian eunuch?",o:["Peter","Paul","Philip","Barnabas"]},
{q:"Who was taken from earth without dying, apart from Elijah?",o:["Moses","Enoch","Abraham","Noah"]},
{q:"I was described as blameless and upright before I lost my wealth, children, and my health. Who am I?",o:["Abraham","Isaac","Job","Jacob"]},
{q:"As I was being stoned, I saw the heavens open and Jesus standing at the right hand of God. Who am I?",o:["James","Stephen","Philip","Timothy"]},
{q:"I used to persecute the early church until a bright light stopped me on the road to Damascus. Who am I?",o:["Barnabas","Silas","Saul (Paul)","Ananias"]},
{q:"I famously said, \"Where you go I will go, and where you stay I will stay. Your people will be my people, and your God my God.\" Who am I?",o:["Orpah","Naomi","Esther","Ruth"]},
{q:"Who saw a valley of dry bones?",o:["Ezekiel","Isaiah","Jeremiah","Daniel"]},
{q:"How long was Lazarus dead before Jesus raised him up?",o:["Two days","Three days","Four days","Seven days"]},
{q:"How many pieces of silver was Jesus betrayed for?",o:["Ten","Twenty","Thirty","Fifty"]},
{q:"What was Paul's name before his conversion?",o:["Saul","Simon","Silas","Stephen"]},
{q:"How many human beings in total were saved on Noah's Ark?",o:["Four","Six","Eight","Twelve"]},
{q:"What was the name of the tower that the people were building when God confused their language?",o:["Tower of Siloam","Tower of Babel","Tower of Jericho","Tower of Nineveh"]},
{q:"Who was the first child born?",o:["Abel","Seth","Cain","Enoch"]},
{q:"What animal is Jesus likened to?",o:["Lion","Lamb","Eagle","Dove"]},
{q:"The prodigal son was starving and was ready to eat the food meant for which animal?",o:["Goats","Sheep","Pigs","Donkeys"]},
{q:"After Jesus was baptized in water, the Holy Spirit descended on Him in the form of a ____?",o:["Eagle","Dove","Flame","Cloud"]},
{q:"What sign did God place in the clouds as an everlasting covenant and promise never to flood the entire earth again?",o:["A rainbow","A star","A pillar of fire","A dove"]},
{q:"According to the creation account in Genesis, on which day did God create the sun, moon, and stars to govern the day and night?",o:["Second day","Third day","Fourth day","Fifth day"]},
{q:"When Moses encountered God at the burning bush in the wilderness, what specific instruction did God give him before they spoke?",o:["Fall on your face","Remove your sandals","Cover your eyes","Put down your staff"]},
{q:"When God originally called Jonah to go and preach to the city of Nineveh, to which distant port city did Jonah try to run away instead?",o:["Joppa","Tyre","Tarshish","Ephesus"]}
];
const ANS=[0,3,1,0,3,1,1,2,1,0,2,1,2,1,2,3,0,2,2,0,2,1,2,1,2,1,0,2,1,2];
const L=['A','B','C','D'],SECONDS=10,$=id=>document.getElementById(id);
let idx=-1,left=SECONDS,timer=null,ac=null;

function ctx(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}
function tone(f,t0,dur,type,vol){
  const a=ctx(),o=a.createOscillator(),g=a.createGain(),s=a.currentTime+t0;
  o.type=type;o.frequency.value=f;o.connect(g);g.connect(a.destination);
  g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(vol,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+dur);
  o.start(s);o.stop(s+dur+.05);
}
const sounds={
  tick(){tone(880,0,.12,'square',.15)},
  start(){tone(660,0,.15,'triangle',.3);tone(990,.15,.2,'triangle',.3)},
  timeup(){tone(140,0,.9,'sawtooth',.35)},
  correct(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.35,'triangle',.35))},
  wrong(){tone(200,0,.35,'sawtooth',.4);tone(150,.3,.6,'sawtooth',.4)}
};

function draw(){
  $('sec').textContent=left;
  $('ring').style.strokeDashoffset=326.7*(1-left/SECONDS);
  $('timerWrap').classList.toggle('low',left<=3&&(timer!==null||left===0));
}
function stopTimer(){clearInterval(timer);timer=null}
function hideOverlay(){$('overlay').classList.remove('show');$('overlay').innerHTML=''}
function reset(){stopTimer();hideOverlay();$('result').textContent='';$('result').className='';left=SECONDS;draw();$('timerWrap').classList.remove('low')}

function showQuestion(i){
  idx=i;reset();
  $('q').textContent=Q[i].q;
  $('opts').innerHTML=Q[i].o.map((t,n)=>'<div class="opt"><span>'+L[n]+'</span>'+t+'<em class="mark"></em></div>').join('');
  $('count').textContent='Question '+(i+1)+' of '+Q.length;
  $('timerWrap').classList.add('on');
  window.scrollTo(0,0);
}
function next(){
  if(idx>=Q.length){return}
  if(idx===Q.length-1){reset();idx=Q.length;$('q').textContent='End of quiz';$('opts').innerHTML='';$('count').textContent='';$('timerWrap').classList.remove('on');return}
  showQuestion(idx+1);
}
function back(){if(idx>0)showQuestion(Math.min(idx,Q.length)-1)}
function startTimer(){
  if(idx<0||idx>=Q.length)return;
  stopTimer();hideOverlay();left=SECONDS;draw();sounds.start();
  timer=setInterval(()=>{
    left--;draw();
    if(left>0&&left<=3)sounds.tick();
    if(left<=0){stopTimer();draw();sounds.timeup()}
  },1000);
}
const CHECK='<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#1f9d57"/><path d="M27 52l16 16 30-34" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CROSS='<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#d93036"/><path d="M32 32l36 36M68 32L32 68" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/></svg>';
function verdict(ok){
  if(idx<0||idx>=Q.length)return;
  stopTimer();
  document.querySelectorAll('.opt').forEach((el,n)=>{
    const good=n===ANS[idx];
    el.classList.remove('good','bad');
    el.classList.add(good?'good':'bad');
    el.querySelector('.mark').textContent=good?'\u2713':'\u2717';
  });
  $('result').textContent=ok?'\u2713 Correct!':'\u2717 Wrong!';
  $('result').className=ok?'good':'bad';
  (ok?sounds.correct:sounds.wrong)();
}
function toggleBar(){$('bar').classList.toggle('hide')}
function fs(){document.fullscreenElement?document.exitFullscreen():(document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen())}
function goTo(n){if(n>=1&&n<=Q.length)showQuestion(n-1)}

// Touch / click controls
const tap=(id,fn)=>$(id).addEventListener('click',()=>{ctx();fn()});
tap('bBack',back);tap('bNext',next);tap('bStart',startTimer);
tap('bOk',()=>verdict(true));tap('bNo',()=>verdict(false));
tap('bFs',fs);tap('tog',toggleBar);
tap('bGo',()=>{goTo(parseInt($('jn').value,10));$('jn').value=''});
$('jn').addEventListener('keydown',e=>{if(e.key==='Enter'){ctx();goTo(parseInt($('jn').value,10));$('jn').value='';e.preventDefault()}});
// tapping the overlay dismisses the check/X
$('overlay').addEventListener('click',hideOverlay);

// Keyboard
let numBuf='',numTimer=null;
function jump(){clearTimeout(numTimer);const n=parseInt(numBuf,10);numBuf='';goTo(n)}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.ctrlKey||e.metaKey||e.altKey)return;
  ctx();
  const k=e.key.toLowerCase();
  if(/^[0-9]$/.test(k)){numBuf=(numBuf+k).slice(0,2);clearTimeout(numTimer);numTimer=setTimeout(jump,800);return}
  if(k==='enter'&&numBuf){jump();return}
  if(k==='n')next();
  else if(k==='s')startTimer();
  else if(k==='c')verdict(true);
  else if(k==='x')verdict(false);
  else if(k==='b')back();
  else if(k==='h')toggleBar();
  else if(k==='f')fs();
});
draw();
</script>
</body>
</html>
